name: android-build

on:
  push:
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
